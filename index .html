<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Physics Sandbox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
            overflow: hidden;
            user-select: none;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism Sidebar & Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Neon Glow Effects */
        .neon-border {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3), inset 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .neon-btn-active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.8), rgba(168, 85, 247, 0.8));
            border-color: rgba(236, 72, 153, 1);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        /* Custom Scrollbar for Controls */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-full w-full relative bg-slate-950 text-slate-100 flex overflow-hidden select-none">

    <!-- CANVAS MAIN CONTAINER -->
    <canvas id="physicsCanvas" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></canvas>

    <!-- HUD TOP BAR -->
    <header class="absolute top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 z-10 flex items-center justify-between pointer-events-none">
        <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 pointer-events-auto neon-border">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
            <h1 class="font-orbitron font-extrabold text-sm sm:text-lg bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500 tracking-wider">
                NEON<span class="text-white">SANDBOX</span>
            </h1>
            <span id="fpsCounter" class="text-xs font-mono text-cyan-300/80 bg-slate-900/60 px-2 py-0.5 rounded-md border border-cyan-500/30">60 FPS</span>
        </div>

        <!-- Quick Top Action Controls -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="toggleAudioBtn" class="glass-panel p-3 rounded-2xl hover:bg-slate-800/80 text-cyan-400 hover:text-white transition active:scale-95">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="clearBtn" class="glass-panel px-4 py-2.5 rounded-2xl bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 border border-rose-500/40 font-bold text-sm flex items-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Limpiar</span>
            </button>
            <button id="toggleMenuBtn" class="glass-panel p-3 rounded-2xl hover:bg-slate-800/80 text-cyan-400 hover:text-white transition active:scale-95">
                <i class="fa-solid fa-sliders text-lg"></i>
            </button>
        </div>
    </header>

    <!-- FLOATING TOOL SELECTION BAR (BOTTOM CENTER) -->
    <nav class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 glass-panel p-2 rounded-2xl flex items-center gap-1 sm:gap-2 neon-border max-w-[95vw] overflow-x-auto">
        <button data-tool="ball" class="tool-btn neon-btn-active px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800">
            <i class="fa-solid fa-circle text-cyan-400"></i> Bolas
        </button>
        <button data-tool="box" class="tool-btn glass-panel px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800">
            <i class="fa-solid fa-square text-fuchsia-400"></i> Cajas
        </button>
        <button data-tool="cloth" class="tool-btn glass-panel px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800">
            <i class="fa-solid fa-border-all text-emerald-400"></i> Tela
        </button>
        <button data-tool="liquid" class="tool-btn glass-panel px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800">
            <i class="fa-solid fa-droplet text-blue-400"></i> Líquido
        </button>
        <div class="h-6 w-px bg-slate-700/60 mx-1"></div>
        <button data-tool="explosion" class="tool-btn glass-panel px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800 text-amber-400">
            <i class="fa-solid fa-burst text-amber-400"></i> Explosión
        </button>
        <button data-tool="attract" class="tool-btn glass-panel px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800 text-pink-400">
            <i class="fa-solid fa-magnet text-pink-400"></i> Imán +
        </button>
        <button data-tool="repel" class="tool-btn glass-panel px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 transition hover:bg-slate-800 text-purple-400">
            <i class="fa-solid fa-ban text-purple-400"></i> Imán -
        </button>
    </nav>

    <!-- SIDEBAR CONTROLS (EXPANDABLE) -->
    <aside id="sidebar" class="absolute top-20 right-4 bottom-20 w-80 z-20 glass-panel rounded-3xl p-5 flex flex-col gap-5 overflow-y-auto transform translate-x-[120%] transition-transform duration-300 ease-out border border-cyan-500/30">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
            <h2 class="font-orbitron font-bold text-cyan-400 text-base flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Ajustes Físicos
            </h2>
            <button id="closeSidebarBtn" class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Gravity -->
        <div class="space-y-2">
            <div class="flex justify-between text-xs font-bold text-slate-300">
                <span>Gravedad</span>
                <span id="gravityVal" class="text-cyan-400">9.8</span>
            </div>
            <input id="gravityInput" type="range" min="-20" max="30" step="0.5" value="9.8" class="w-full accent-cyan-400 bg-slate-900 rounded-lg cursor-pointer">
        </div>

        <!-- Elasticity (Bounce) -->
        <div class="space-y-2">
            <div class="flex justify-between text-xs font-bold text-slate-300">
                <span>Elasticidad / Rebote</span>
                <span id="bounceVal" class="text-fuchsia-400">0.80</span>
            </div>
            <input id="bounceInput" type="range" min="0" max="1" step="0.05" value="0.8" class="w-full accent-fuchsia-400 bg-slate-900 rounded-lg cursor-pointer">
        </div>

        <!-- Friction -->
        <div class="space-y-2">
            <div class="flex justify-between text-xs font-bold text-slate-300">
                <span>Fricción</span>
                <span id="frictionVal" class="text-emerald-400">0.99</span>
            </div>
            <input id="frictionInput" type="range" min="0.8" max="1" step="0.005" value="0.99" class="w-full accent-emerald-400 bg-slate-900 rounded-lg cursor-pointer">
        </div>

        <!-- Wind -->
        <div class="space-y-2">
            <div class="flex justify-between text-xs font-bold text-slate-300">
                <span>Viento Lateral</span>
                <span id="windVal" class="text-blue-400">0.0</span>
            </div>
            <input id="windInput" type="range" min="-5" max="5" step="0.1" value="0" class="w-full accent-blue-400 bg-slate-900 rounded-lg cursor-pointer">
        </div>

        <!-- Particle Spawner Size -->
        <div class="space-y-2">
            <div class="flex justify-between text-xs font-bold text-slate-300">
                <span>Tamaño de Objetos</span>
                <span id="sizeVal" class="text-amber-400">24px</span>
            </div>
            <input id="sizeInput" type="range" min="10" max="60" step="2" value="24" class="w-full accent-amber-400 bg-slate-900 rounded-lg cursor-pointer">
        </div>

        <!-- Quick Presets -->
        <div class="pt-2 border-t border-slate-700/60 space-y-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Preajustes</span>
            <div class="grid grid-cols-2 gap-2">
                <button id="presetZeroG" class="bg-slate-900/80 hover:bg-slate-800 text-xs font-bold py-2 rounded-xl border border-slate-700 text-cyan-300 transition">🚀 Cero G</button>
                <button id="presetSuperBounce" class="bg-slate-900/80 hover:bg-slate-800 text-xs font-bold py-2 rounded-xl border border-slate-700 text-fuchsia-300 transition">🏀 Hiper Rebote</button>
            </div>
        </div>

        <div class="mt-auto text-center text-xs text-slate-500 font-mono pt-4 border-t border-slate-800">
            Haz clic y arrastra en el tapiz para interactuar.
        </div>
    </aside>

    <script>
        /* ------------------------------------------------------------------
         * WEB AUDIO SYNTHESIZER FOR NEON SOUND EFFECTS
         * ------------------------------------------------------------------ */
        class SynthAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playPop(freq = 440, volume = 0.1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.3, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {}
            }

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.3);

                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }

            playMagnetSound() {
                if (!this.enabled || !this.ctx) return;
                if (Math.random() > 0.15) return; // Throttle sound
                this.playPop(200 + Math.random() * 400, 0.03);
            }
        }

        const audio = new SynthAudio();

        /* ------------------------------------------------------------------
         * PHYSICS ENGINE STATE & CONFIGURATION
         * ------------------------------------------------------------------ */
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Config Parameters
        const physics = {
            gravity: 9.8,
            bounce: 0.8,
            friction: 0.99,
            wind: 0,
            objectSize: 24,
            activeTool: 'ball'
        };

        // Arrays for physical entities
        let bodies = [];
        let clothPoints = [];
        let clothConstraints = [];
        let shockwaves = [];

        // Neon Palette
        const NEON_COLORS = [
            '#06b6d4', // Cyan
            '#a855f7', // Purple
            '#ec4899', // Pink
            '#10b981', // Emerald
            '#f59e0b', // Amber
            '#3b82f6'  // Blue
        ];

        function getRandomNeon() {
            return NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
        }

        /* ------------------------------------------------------------------
         * RIGID BODIES (BALLS, BOXES, LIQUIDS)
         * ------------------------------------------------------------------ */
        class Body {
            constructor(x, y, type = 'ball', size = 24, color = null) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.type = type; // 'ball', 'box', 'liquid'
                this.radius = type === 'liquid' ? size * 0.4 : size / 2;
                this.width = size;
                this.height = size;
                this.color = color || getRandomNeon();
                this.angle = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.1;
                this.isPinned = false;
                this.isDragging = false;
            }

            update() {
                if (this.isDragging || this.isPinned) return;

                // Physics forces
                this.vy += (physics.gravity * 0.05);
                this.vx += (physics.wind * 0.05);

                this.vx *= physics.friction;
                this.vy *= physics.friction;

                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vRot;

                // Collisions with Canvas Boundaries
                const bounce = physics.bounce;

                // Bottom
                if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy *= -bounce;
                    this.vx *= physics.friction;
                    if (Math.abs(this.vy) > 1) audio.playPop(150 + Math.abs(this.vy) * 20, 0.05);
                }
                // Top
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -bounce;
                }
                // Right
                if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -bounce;
                }
                // Left
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -bounce;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'ball' || this.type === 'liquid') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = this.type === 'liquid' ? 8 : 15;
                    ctx.fill();

                    // Liquid shine
                    if (this.type === 'liquid') {
                        ctx.beginPath();
                        ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.fill();
                    }
                } else if (this.type === 'box') {
                    ctx.rotate(this.angle);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);
                }

                ctx.restore();
            }
        }

        /* ------------------------------------------------------------------
         * VERLET CLOTH SYSTEM (SOFT BODY / TEXTILE)
         * ------------------------------------------------------------------ */
        class ClothPoint {
            constructor(x, y, pinned = false) {
                this.x = x;
                this.y = y;
                this.oldX = x;
                this.oldY = y;
                this.pinned = pinned;
                this.color = '#10b981';
            }

            update() {
                if (this.pinned) return;

                const vx = (this.x - this.oldX) * physics.friction + (physics.wind * 0.05);
                const vy = (this.y - this.oldY) * physics.friction + (physics.gravity * 0.05);

                this.oldX = this.x;
                this.oldY = this.y;

                this.x += vx;
                this.y += vy;

                // Floor boundary
                if (this.y > height - 10) {
                    this.y = height - 10;
                    this.oldY = this.y + vy * physics.bounce;
                }
            }
        }

        class Constraint {
            constructor(p1, p2, distance) {
                this.p1 = p1;
                this.p2 = p2;
                this.distance = distance;
            }

            resolve() {
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist === 0) return;

                const diff = (this.distance - dist) / dist;
                const offsetX = dx * diff * 0.5;
                const offsetY = dy * diff * 0.5;

                if (!this.p1.pinned) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.pinned) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }
            }
        }

        function spawnCloth(startX, startY, cols = 12, rows = 8, spacing = 20) {
            const newPoints = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const pinned = (r === 0 && (c === 0 || c === Math.floor(cols / 2) || c === cols - 1));
                    const p = new ClothPoint(startX + c * spacing, startY + r * spacing, pinned);
                    newPoints.push(p);
                    clothPoints.push(p);
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    if (c < cols - 1) {
                        clothConstraints.push(new Constraint(newPoints[idx], newPoints[idx + 1], spacing));
                    }
                    if (r < rows - 1) {
                        clothConstraints.push(new Constraint(newPoints[idx], newPoints[idx + cols], spacing));
                    }
                }
            }
        }

        /* ------------------------------------------------------------------
         * EXPLOSION SHOCKWAVE EFFECT
         * ------------------------------------------------------------------ */
        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = 180;
                this.alpha = 1;
                this.color = getRandomNeon();
            }

            update() {
                this.radius += 12;
                this.alpha -= 0.04;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 4;
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.restore();
            }
        }

        /* ------------------------------------------------------------------
         * MOUSE & TOUCH INTERACTION ENGINE
         * ------------------------------------------------------------------ */
        const mouse = {
            x: 0,
            y: 0,
            isDown: false,
            draggedBody: null
        };

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerDown(e) {
            audio.init();
            const pos = getPos(e);
            mouse.x = pos.x;
            mouse.y = pos.y;
            mouse.isDown = true;

            // Check if clicking existing body to drag
            for (let b of bodies) {
                const dist = Math.hypot(b.x - mouse.x, b.y - mouse.y);
                if (dist < b.radius * 1.5) {
                    mouse.draggedBody = b;
                    b.isDragging = true;
                    return;
                }
            }

            // Otherwise, apply active tool action
            spawnToolAction(mouse.x, mouse.y);
        }

        function handlePointerMove(e) {
            const pos = getPos(e);
            mouse.x = pos.x;
            mouse.y = pos.y;

            if (mouse.isDown && mouse.draggedBody) {
                mouse.draggedBody.x = mouse.x;
                mouse.draggedBody.y = mouse.y;
                mouse.draggedBody.vx = 0;
                mouse.draggedBody.vy = 0;
            } else if (mouse.isDown && (physics.activeTool === 'attract' || physics.activeTool === 'repel')) {
                applyMagnetForce(mouse.x, mouse.y, physics.activeTool === 'attract');
            }
        }

        function handlePointerUp() {
            if (mouse.draggedBody) {
                mouse.draggedBody.isDragging = false;
                mouse.draggedBody = null;
            }
            mouse.isDown = false;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: true });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: true });
        window.addEventListener('touchend', handlePointerUp);

        /* Spawn Object or Trigger Special Tool */
        function spawnToolAction(x, y) {
            const size = physics.objectSize;

            switch (physics.activeTool) {
                case 'ball':
                    bodies.push(new Body(x, y, 'ball', size));
                    audio.playPop(300, 0.1);
                    break;
                case 'box':
                    bodies.push(new Body(x, y, 'box', size));
                    audio.playPop(200, 0.1);
                    break;
                case 'liquid':
                    for (let i = 0; i < 8; i++) {
                        bodies.push(new Body(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, 'liquid', size, '#38bdf8'));
                    }
                    audio.playPop(500, 0.1);
                    break;
                case 'cloth':
                    spawnCloth(x - 80, y - 20, 10, 7, 18);
                    audio.playPop(400, 0.1);
                    break;
                case 'explosion':
                    triggerExplosion(x, y);
                    break;
                case 'attract':
                case 'repel':
                    applyMagnetForce(x, y, physics.activeTool === 'attract');
                    break;
            }
        }

        function triggerExplosion(x, y) {
            shockwaves.push(new Shockwave(x, y));
            audio.playExplosion();

            // Spawn explosive particle debris
            for (let i = 0; i < 25; i++) {
                const p = new Body(x, y, 'ball', 10 + Math.random() * 10);
                const angle = Math.random() * Math.PI * 2;
                const force = 12 + Math.random() * 18;
                p.vx = Math.cos(angle) * force;
                p.vy = Math.sin(angle) * force;
                bodies.push(p);
            }

            // Blast existing bodies away
            for (let b of bodies) {
                const dx = b.x - x;
                const dy = b.y - y;
                const dist = Math.hypot(dx, dy);
                if (dist < 200 && dist > 0) {
                    const force = (200 - dist) / 10;
                    b.vx += (dx / dist) * force;
                    b.vy += (dy / dist) * force;
                }
            }
        }

        function applyMagnetForce(x, y, isAttract) {
            audio.playMagnetSound();
            const strength = isAttract ? 1.2 : -2.0;

            for (let b of bodies) {
                const dx = x - b.x;
                const dy = y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 350 && dist > 5) {
                    const force = (350 - dist) / 350 * strength;
                    b.vx += (dx / dist) * force;
                    b.vy += (dy / dist) * force;
                }
            }

            for (let p of clothPoints) {
                const dx = x - p.x;
                const dy = y - p.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 250 && dist > 5) {
                    const force = (250 - dist) / 250 * strength * 0.5;
                    p.x += (dx / dist) * force;
                    p.y += (dy / dist) * force;
                }
            }
        }

        /* ------------------------------------------------------------------
         * BODY-TO-BODY COLLISION RESOLUTION
         * ------------------------------------------------------------------ */
        function resolveCollisions() {
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    const b1 = bodies[i];
                    const b2 = bodies[j];

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = b1.radius + b2.radius;

                    if (dist < minDist && dist > 0) {
                        // Overlap resolution
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        b1.x -= nx * overlap * 0.5;
                        b1.y -= ny * overlap * 0.5;
                        b2.x += nx * overlap * 0.5;
                        b2.y += ny * overlap * 0.5;

                        // Elastic impulse response
                        const kx = b1.vx - b2.vx;
                        const ky = b1.vy - b2.vy;
                        const p = 2 * (nx * kx + ny * ky) / 2;

                        b1.vx -= p * nx * physics.bounce;
                        b1.vy -= p * ny * physics.bounce;
                        b2.vx += p * nx * physics.bounce;
                        b2.vy += p * ny * physics.bounce;
                    }
                }
            }
        }

        /* ------------------------------------------------------------------
         * MAIN ANIMATION / PHYSICS LOOP
         * ------------------------------------------------------------------ */
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        function animate() {
            // FPS Calculation
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById('fpsCounter').textContent = `${fps} FPS`;
            }

            // Clear Canvas with subtle trail effect
            ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Update & Render Shockwaves
            shockwaves = shockwaves.filter(s => s.alpha > 0);
            shockwaves.forEach(s => {
                s.update();
                s.draw();
            });

            // Update Cloth Verlet Simulation
            clothPoints.forEach(p => p.update());
            for (let i = 0; i < 4; i++) {
                clothConstraints.forEach(c => c.resolve());
            }

            // Draw Cloth Mesh Lines
            ctx.beginPath();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 8;
            clothConstraints.forEach(c => {
                ctx.moveTo(c.p1.x, c.p1.y);
                ctx.lineTo(c.p2.x, c.p2.y);
            });
            ctx.stroke();

            // Resolve Rigid Bodies
            resolveCollisions();
            bodies.forEach(b => {
                b.update();
                b.draw();
            });

            // Magnet Tool Visual Ring
            if (mouse.isDown && (physics.activeTool === 'attract' || physics.activeTool === 'repel')) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
                ctx.strokeStyle = physics.activeTool === 'attract' ? '#ec4899' : '#a855f7';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        /* ------------------------------------------------------------------
         * UI CONTROLLERS & EVENT BINDINGS
         * ------------------------------------------------------------------ */
        // Tool Buttons
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => {
                    b.classList.remove('neon-btn-active');
                    b.classList.add('glass-panel');
                });
                const target = e.currentTarget;
                target.classList.add('neon-btn-active');
                target.classList.remove('glass-panel');
                physics.activeTool = target.dataset.tool;
            });
        });

        // Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        document.getElementById('toggleMenuBtn').addEventListener('click', () => {
            sidebar.classList.toggle('translate-x-[120%]');
        });
        document.getElementById('closeSidebarBtn').addEventListener('click', () => {
            sidebar.classList.add('translate-x-[120%]');
        });

        // Sliders Realtime Updates
        function bindSlider(id, valId, prop, suffix = '') {
            const input = document.getElementById(id);
            const valSpan = document.getElementById(valId);
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                physics[prop] = val;
                valSpan.textContent = `${val}${suffix}`;
            });
        }

        bindSlider('gravityInput', 'gravityVal', 'gravity');
        bindSlider('bounceInput', 'bounceVal', 'bounce');
        bindSlider('frictionInput', 'frictionVal', 'friction');
        bindSlider('windInput', 'windVal', 'wind');
        bindSlider('sizeInput', 'sizeVal', 'objectSize', 'px');

        // Clear Canvas Button
        document.getElementById('clearBtn').addEventListener('click', () => {
            bodies = [];
            clothPoints = [];
            clothConstraints = [];
            shockwaves = [];
            audio.playPop(150, 0.2);
        });

        // Audio Toggle
        document.getElementById('toggleAudioBtn').addEventListener('click', (e) => {
            audio.enabled = !audio.enabled;
            e.currentTarget.classList.toggle('text-rose-400');
            e.currentTarget.classList.toggle('text-cyan-400');
        });

        // Presets
        document.getElementById('presetZeroG').addEventListener('click', () => {
            physics.gravity = 0;
            document.getElementById('gravityInput').value = 0;
            document.getElementById('gravityVal').textContent = '0';
        });

        document.getElementById('presetSuperBounce').addEventListener('click', () => {
            physics.bounce = 0.98;
            document.getElementById('bounceInput').value = 0.98;
            document.getElementById('bounceVal').textContent = '0.98';
        });

        // Initial default scene setup
        window.onload = () => {
            // Spawn some initial fun bodies
            for (let i = 0; i < 15; i++) {
                bodies.push(new Body(width / 2 + (Math.random() - 0.5) * 200, 100 + i * 15, 'ball', 28));
            }
            spawnCloth(width / 2 - 100, 80, 10, 6, 20);
            animate();
        };
    </script>
</body>
</html>
